# Remuda Hub only. Does not start or reconfigure Caddy / AsterGate / cloudflared.
#
# Attach to the existing compose project network on devbox-sg-host.
# Verified 2026-09-12 (read-only `docker network ls`):
#   NAME=deploy_default  DRIVER=bridge  SCOPE=local
# Compose project `deploy` lives at ~/astergate/deploy on that host.
#
# Load the M1 tarball first (`docker load -i remuda-hub-<sha>.tar`) so the
# `remuda-hub:m1` tag exists locally. No `ports:` — Hub is reached through
# Caddy on the same Docker network.

services:
  remuda-hub:
    image: remuda-hub:m1
    command: ["hub", "--listen", "0.0.0.0:8080"]
    user: "65532:65532"
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - /data00/remuda/hub:/data
      - ./hub.toml:/etc/remuda/hub.toml:ro
    environment:
      REMUDA_DATA_DIR: /data
      REMUDA_CONFIG: /etc/remuda/hub.toml
    restart: unless-stopped
    networks: [deploy_default]

networks:
  deploy_default:
    external: true

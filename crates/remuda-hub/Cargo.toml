[package]
name = "remuda-hub"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Hub authentication, host registry, routing, and embedded Web assets."

[lints]
workspace = true

[features]
default = []
# Embed `web/dist` when present at compile time; otherwise a 404 placeholder.
embed-web = []

[dependencies]
anyhow.workspace = true
async-trait = "0.1"
argon2.workspace = true
axum.workspace = true
base64 = "0.22"
futures.workspace = true
remuda-driver.workspace = true
remuda-protocol.workspace = true
remuda-ssh.workspace = true
remuda-push.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite.workspace = true
rust-embed = { workspace = true, features = ["interpolate-folder-path"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { workspace = true, features = ["v5"] }
url = "2"
# 0.5.5: the safe wrapper cannot construct RP config for IP-literal loopback
# origins (dev/e2e serve on http://127.0.0.1), and its only constructor that
# can, WebauthnCore::new_unsafe_experts_only, is not re-exported. We replicate
# the wrapper's exact passkey ceremony parameters on top of core. MPL-2.0.
webauthn-rs-core = "=0.5.5"

[dev-dependencies]
anyhow.workspace = true
base64 = "0.22"
ece = { version = "2.2", default-features = false, features = ["backend-openssl"] }
# Software ES256 authenticator for the passkey ceremony tests (D-029).
openssl = "0.10"
serde_cbor_2 = "0.13"
sha2.workspace = true
rusqlite.workspace = true
tempfile = "3"
time.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-tungstenite.workspace = true
tracing-subscriber.workspace = true
uuid = { workspace = true, features = ["v5"] }

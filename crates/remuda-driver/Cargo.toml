[package]
name = "remuda-driver"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Native Claude print, PTY, and background driver implementations."

[lints]
workspace = true

[features]
default = []
# In-process FakeDriver for Node/Web loopback. Not installed in release images.
test-stub = []
# macOS `security` CLI keychain backend. Tests are `#[ignore]`.
keychain = []

[dependencies]
base64 = "0.22"
async-trait = "0.1"
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
portable-pty.workspace = true
remuda-acp-wire.workspace = true
remuda-claude-wire.workspace = true
remuda-herdr.workspace = true
remuda-protocol.workspace = true
remuda-signal.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
toml = "0.8"
tracing.workspace = true
uuid.workspace = true
zeroize = "1.9"

[dev-dependencies]
remuda-testing.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[package]
name = "remuda-node"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Node instance management and outbound Hub connection."

[features]
default = []
# Test-only fault/race hooks (gate.run entry holds and similar). Enabling
# the feature exposes them in a non-test build; the production default and
# the shipped binary carry none of the fields or call sites.
test-faults = []

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
# The WSS session loop owns ten tightly coupled channel/config endpoints. Keep
# the signature explicit until its carrier state is consolidated after M0.
too_many_arguments = "allow"

[[bin]]
name = "remuda-node-stdio"
path = "src/bin/node_stdio.rs"

[dependencies]
anyhow.workspace = true
async-trait = "0.1"
axum.workspace = true
base64 = "0.22"
bytes.workspace = true
clap.workspace = true
futures.workspace = true
glob = "0.3"
ignore = "0.4"
regex = "1"
remuda-driver.workspace = true
remuda-herdr.workspace = true
remuda-journal.workspace = true
remuda-protocol.workspace = true
remuda-signal.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "2.6"
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
url = "2"
tracing.workspace = true
uuid.workspace = true
nix = { version = "0.28", features = ["process", "fs", "signal"] }
plist = { version = "1.10.1", default-features = false }

[dev-dependencies]
portable-pty.workspace = true
remuda-driver = { workspace = true, features = ["test-stub"] }
remuda-hub.workspace = true
# Self dependency enabling the test-only race/fault hooks in `cargo test`
# (the pattern remuda-hub uses for its test-faults feature).
remuda-node = { path = ".", features = ["test-faults"] }
remuda-testing.workspace = true
serde_json.workspace = true
tempfile = "3"
tokio-tungstenite.workspace = true

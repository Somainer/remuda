name: ${COMPOSE_PROJECT_NAME:-remuda-public}

services:
  remuda-hub:
    # Build/import the static musl image with deploy/m1/Dockerfile.
    image: ${HUB_IMAGE:?Set HUB_IMAGE to an explicit release tag}
    command: ["hub", "--listen", "0.0.0.0:8080"]
    user: "65532:65532"
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      REMUDA_DATA_DIR: /data
      REMUDA_HUB_LISTEN: 0.0.0.0:8080
      REMUDA_PUBLIC_ORIGIN: https://${HUB_DOMAIN:?Set HUB_DOMAIN}
      REMUDA_TRUSTED_PROXIES: '["${PROXY_IP:-172.30.19.2}"]'
      REMUDA_COOKIE_SECURE: "true"
    volumes:
      - hub_data:/data
    tmpfs:
      - /tmp:mode=1777,size=64m
    healthcheck:
      test: [CMD, /usr/local/bin/remuda, hub, --healthcheck]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [hub_proxy]

  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    depends_on:
      remuda-hub:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      HUB_DOMAIN: ${HUB_DOMAIN:?Set HUB_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./Caddyfile.routes:/etc/caddy/Caddyfile.routes:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:mode=1777,size=32m
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      hub_proxy:
        ipv4_address: ${PROXY_IP:-172.30.19.2}

volumes:
  hub_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-/var/lib/remuda-public}
  caddy_data:
  caddy_config:

networks:
  # Dedicated bridge; only this Caddy address is trusted by the Hub.
  hub_proxy:
    driver: bridge
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.30.19.0/24}

[package]
name = "remuda-driver"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Native Claude print, PTY, and background driver implementations."

[lints]
workspace = true

[features]
default = []
# In-process FakeDriver for Node/Web loopback. Not installed in release images.
test-stub = ["remuda-claude-wire/test-stub"]
# macOS `security` CLI keychain backend. Tests are `#[ignore]`.
keychain = []

[dependencies]
base64 = "0.22"
async-trait = "0.1"
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
portable-pty.workspace = true
remuda-acp-wire.workspace = true
remuda-claude-wire.workspace = true
remuda-herdr.workspace = true
remuda-protocol.workspace = true
remuda-screen.workspace = true
remuda-signal.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
toml = "0.8"
tracing.workspace = true
uuid.workspace = true
zeroize = "1.9"

# D-028 §5.3 needs `killpg` on the PTY's process group: the stop ladder has to
# reach everything the session started, and `std` can only signal a direct
# child. Unix-only, matching the `tcgetpgrp` identity path this pairs with;
# `remuda-node` already depends on the same version for its access probe.
# The "event" feature supplies the safe kqueue wrapper for the r15 item-2
# child-exit wait on macOS; "pthread" supplies the safe thread-directed
# `pthread_kill` for the r16 item-2 EINTR regression.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", features = ["process", "signal", "event", "pthread"] }

# r15 item 2: the event-driven child-exit wait parks on pidfd/poll (safe
# wrappers; the workspace forbids `unsafe`, and nix 0.28 has no pidfd
# binding). Linux devboxes only — the macOS arm uses nix's kqueue above.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["process", "event"] }

[dev-dependencies]
# Enable the test-only surface (`StdoutMapper`) for this crate's own
# integration tests, which do not see `cfg(test)` of the lib target.
remuda-driver = { path = ".", features = ["test-stub"] }
# Journal/live effort read-back parity replays the same transcript through
# both mappers.
remuda-journal = { path = "../remuda-journal" }
anyhow.workspace = true
remuda-testing.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# r16 item 2: install a SAFE empty SIGUSR1 handler for the EINTR regression
# (the workspace forbids `unsafe`, so nix's unsafe `sigaction` is off-limits;
# ppoll(2) returns EINTR even with the registry's SA_RESTART). Unix only.
[target.'cfg(unix)'.dev-dependencies]
signal-hook = "0.3"

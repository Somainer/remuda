[package]
name = "remuda-node"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Node instance management and outbound Hub connection."

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
# The WSS session loop owns ten tightly coupled channel/config endpoints. Keep
# the signature explicit until its carrier state is consolidated after M0.
too_many_arguments = "allow"

[[bin]]
name = "remuda-node-stdio"
path = "src/bin/node_stdio.rs"

[dependencies]
anyhow.workspace = true
async-trait = "0.1"
axum.workspace = true
base64 = "0.22"
clap.workspace = true
futures.workspace = true
remuda-driver.workspace = true
remuda-herdr.workspace = true
remuda-journal.workspace = true
remuda-protocol.workspace = true
remuda-signal.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
uuid.workspace = true
nix = { version = "0.28", features = ["process", "fs", "signal"] }

[dev-dependencies]
remuda-hub.workspace = true
remuda-testing.workspace = true
tempfile = "3"
tokio-tungstenite.workspace = true

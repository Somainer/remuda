[package]
name = "remuda"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Remuda Hub, Node, and local development command entry points."

[lints]
workspace = true

[dependencies]
time = { workspace = true }
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
remuda-hub = { workspace = true, features = ["embed-web"] }
remuda-feishu.workspace = true
remuda-node.workspace = true
remuda-protocol.workspace = true
remuda-ssh.workspace = true
remuda-hub-client.workspace = true
regex = "1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml = "0.8"
tracing.workspace = true
tracing-subscriber.workspace = true
nix = { version = "0.28", features = ["process"] }

[target.'cfg(target_env = "musl")'.dependencies]
# Static Node artifacts (just linux-musl / deploy/m1) vendor OpenSSL so
# openssl-sys does not require a musl sysroot on the operator laptop.
openssl = { version = "0.10", features = ["vendored"] }

[build-dependencies]
time.workspace = true

[dev-dependencies]
anyhow.workspace = true
futures.workspace = true
remuda-driver = { workspace = true, features = ["test-stub"] }
remuda-hub.workspace = true
remuda-protocol.workspace = true
serde_json.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "net", "process", "test-util"] }
tokio-tungstenite.workspace = true

[package]
name = "remuda-driver"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Native Claude print, PTY, and background driver implementations."

[lints]
workspace = true

[features]
default = []
# In-process FakeDriver for Node/Web loopback. Not installed in release images.
test-stub = []

[dependencies]
async-trait = "0.1"
remuda-claude-wire.workspace = true
remuda-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
remuda-testing.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

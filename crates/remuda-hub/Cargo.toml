[package]
name = "remuda-hub"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Hub authentication, host registry, routing, and embedded Web assets."

[lints]
workspace = true

[features]
default = []
# Embed `web/dist` when present at compile time; otherwise a 404 placeholder.
embed-web = []

[dependencies]
anyhow.workspace = true
async-trait = "0.1"
argon2.workspace = true
axum.workspace = true
base64 = "0.22"
futures.workspace = true
remuda-driver.workspace = true
remuda-protocol.workspace = true
remuda-ssh.workspace = true
remuda-push.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite.workspace = true
rust-embed = { workspace = true, features = ["interpolate-folder-path"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
anyhow.workspace = true
base64 = "0.22"
ece = { version = "2.2", default-features = false, features = ["backend-openssl"] }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-tungstenite.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

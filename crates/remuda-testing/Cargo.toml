[package]
name = "remuda-testing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "fake-claude stream-json test double, fake-herdr socket, and captured CLI fixtures."

[[bin]]
name = "fake-claude"
path = "src/bin/fake-claude.rs"

[[bin]]
name = "fake-herdr"
path = "src/bin/fake-herdr.rs"

[[bin]]
name = "m0-print-stub"
path = "src/bin/m0-print-stub.rs"

[[bin]]
name = "fake-harness"
path = "src/bin/fake-harness.rs"

[[bin]]
name = "fake-gateway"
path = "src/bin/fake-gateway.rs"

[[bin]]
name = "fake-claude-replay"
path = "src/bin/fake-claude-replay.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
fs2 = "0.4"
futures.workspace = true
nix = { version = "0.28", default-features = false, features = ["fs", "poll", "process", "signal", "term"] }
portable-pty.workspace = true
remuda-driver.workspace = true
remuda-herdr.workspace = true
remuda-journal.workspace = true
remuda-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
sha2.workspace = true
signal-hook = "0.3"
terminal_size = "0.4"
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
async-trait = "0.1"
remuda-driver.workspace = true
remuda-journal.workspace = true
remuda-protocol.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

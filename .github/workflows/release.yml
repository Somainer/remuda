# Tag-triggered release draft. Builds a musl static `remuda` and pushes
# `ghcr.io/somainer/remuda`. This workflow is not required to succeed in
# this repository yet (no extra registry secret; GHCR uses GITHUB_TOKEN).
#
# Trigger: git tag v0.1.0 && git push origin v0.1.0

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  IMAGE: ghcr.io/somainer/remuda

jobs:
  musl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain
      - name: Add musl target
        run: rustup target add x86_64-unknown-linux-musl
      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build remuda (musl, static-ish)
        env:
          REMUDA_GIT_SHA: ${{ github.sha }}
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --locked --release -p remuda --target x86_64-unknown-linux-musl
      - name: Record binary identity
        run: |
          bin=target/x86_64-unknown-linux-musl/release/remuda
          file "$bin"
          ldd "$bin" || true
          sha256sum "$bin"
          "$bin" version
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: remuda-x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/release/remuda
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/x86_64-unknown-linux-musl/release/remuda
        continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          build-args: |
            REMUDA_GIT_SHA=${{ github.sha }}

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deploy-public:
    # D-031: validate retained public assets only; public exposure is pending.
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-c-deploy
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Install build and package check tools
        run: |
          rustup show active-toolchain
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y musl-tools shellcheck
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build embedded web assets
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Lint public deployment scripts
        run: shellcheck deploy/public/*.sh scripts/ci/deploy-public.sh
      - name: Build the M1 musl image for the public package
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          cargo build --locked -p remuda --target x86_64-unknown-linux-musl
          mkdir -p deploy/out
          cp "$CARGO_TARGET_DIR/x86_64-unknown-linux-musl/debug/remuda" deploy/out/remuda-linux-musl
          cp NOTICE LICENSE deploy/out/
          docker build -f deploy/m1/Dockerfile -t remuda-hub:ci deploy/out
      - name: Compose config and HTTPS smoke through internal Caddy
        run: ./scripts/ci/deploy-public.sh

  rust:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-gate
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain
      - name: Generated coordinator skill is current
        run: ./scripts/gen-skill.sh --check
      - name: Coordinator script tests
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Committed skills lint clean
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          ./scripts/ci/skills-lint.sh
      - name: Prebuild remuda-testing bins
        run: cargo build -p remuda-testing --bins --locked
      - name: Shared Rust merge gate
        run: ./scripts/ci/gate.sh

  macos-check:
    # Linux-only gates cannot catch platform cfg mistakes (c-macbuild: the
    # SOCK_NONBLOCK/SOCK_CLOEXEC breakage that main shipped). Check only; the
    # test matrix stays Linux.
    runs-on: macos-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain
      - name: Check the whole workspace on macOS
        run: cargo check --workspace --all-targets --locked

  m0-stub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain
      - name: M0 stub acceptance
        run: ./scripts/acceptance/m0.sh --mode stub

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan secrets and private tokens
        run: |
          test -s scripts/ci/private-tokens.sha256
          ./scripts/ci/secret-scan.sh --self-test
          ./scripts/ci/secret-scan.sh
      - name: Enforce D-031 deployment policy
        run: |
          ./scripts/ci/no-tunnel-scan.sh --self-test
          ./scripts/ci/no-tunnel-scan.sh

  cargo-audit:
    name: cargo-audit (optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain
      - name: cargo audit
        # Never fail the workflow. cargo-audit 0.21.2 (last crate that builds on
        # rustc 1.94.1) cannot parse CVSS 4.0 advisories on current advisory-db.
        # Walk recent DB history; if parse still fails, warn and exit 0.
        continue-on-error: true
        run: |
          set +e
          cargo install cargo-audit --locked --version 0.21.2
          db="${RUNNER_TEMP}/advisory-db"
          git clone --depth 80 https://github.com/rustsec/advisory-db.git "$db"
          parsed=0
          i=0
          while [ "$i" -lt 40 ]; do
            if cargo audit --db "$db" --stale; then
              parsed=1
              break
            fi
            git -C "$db" checkout --quiet HEAD~1 || break
            i=$((i + 1))
          done
          if [ "$parsed" -ne 1 ]; then
            echo "::warning::cargo-audit optional: no parseable advisory-db (CVSS 4.0 vs 0.21.2); not blocking"
          fi
          exit 0

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Shared web merge gate
        run: ./scripts/ci/gate.sh --web-only
      - name: Generated OpenAPI client is current
        run: |
          pnpm --dir web run gen:api
          git diff --exit-code -- web/src/lib/api.generated.ts
      - name: Lint
        run: pnpm --dir web lint

  web-hub-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web
        run: pnpm --dir web install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Hub live e2e
        run: pnpm --dir web run test:e2e:hub

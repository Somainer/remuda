[package]
name = "remuda-testing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "fake-claude stream-json test double, fake-herdr socket, and captured CLI fixtures."

[[bin]]
name = "fake-claude"
path = "src/bin/fake-claude.rs"

[[bin]]
name = "fake-herdr"
path = "src/bin/fake-herdr.rs"


# Remuda Hub only. Does not start or reconfigure Caddy / AsterGate.
#
# Attach to the existing compose project network on devbox-sg-host.
# Verified 2026-09-12 (read-only `docker network ls`):
#   NAME=deploy_default  DRIVER=bridge  SCOPE=local
# Compose project `deploy` lives at ~/astergate/deploy on that host.
#
# Load the M1 tarball first (`docker load -i remuda-hub-<sha>.tar`) so the
# `remuda-hub:m1` tag exists locally. No `ports:` — Hub is reached through
# Caddy on the same Docker network.

services:
  remuda-hub:
    image: remuda-hub:m1
    command: ["hub", "--listen", "0.0.0.0:8080"]
    user: "65532:65532"
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - /data00/remuda/hub:/data
      # Separate read-only secrets mount for an operator-pinned access code
      # (bootstrapToken = "file:/secrets/access-code"). Kept OUTSIDE the
      # writable data dir so a cp -r restore cannot carry a newer-mtime access
      # file over the restored stamp. The Hub runs as 65532:65532 (user:
      # above), so create the host dir owned by 65532:65532, mode 0700, and
      # the access-code file 0600 owned by 65532:65532 — a root-owned 0700
      # dir is EACCES for the nonroot process. See m1/README.md A2.
      - /data00/remuda/secrets:/secrets:ro
      - ./hub.toml:/etc/remuda/hub.toml:ro
    environment:
      REMUDA_DATA_DIR: /data
      REMUDA_CONFIG: /etc/remuda/hub.toml
    restart: unless-stopped
    networks: [deploy_default]

networks:
  deploy_default:
    external: true
